# The dev stack's settings. Every file the stack runs with is rendered from
# this one into .infrapi-dev/ (make render, and make up renders first):
# Kayra's configuration and users, the gateway's routes, the ports, the
# example API's settings. Edit it, then make up. See docs/dev-stack.md.

# Kayra's app.api_domain. Its own groups are system.<domain>,
# catalog.<domain> and authorization.<domain>, and every API below is
# <name>.<domain>.
domain: infrapi.io
platform: sandbox    # sandbox, preprod or prod
region: eu-west-1
location: dc1

kayra:
  # The image Kayra and its reconciler run, as released by infrapi/kayra.
  image: ghcr.io/infrapi/kayra:latest
  # Or build it from a checkout instead (make build): set src, and image
  # is ignored.
  # src: ../kayra

# Where the stack listens, on 127.0.0.1.
ports:
  kayra: 8081        # Kayra, directly
  gateway: 9080      # APISIX: Kayra and your APIs
  gateway_tls: 9443
  admin: 9180        # APISIX Admin API, and its UI at /ui
  prometheus: 9091   # APISIX
  control: 9092      # APISIX
  etcd: 2379

# The groups Kayra's cluster endpoints require (namespaces, API
# registrations, cluster RBAC). make contexts mints dev-admin with the first.
sysadmin_groups:
  - sandbox-core-sysadmin

# The users of Kayra's "local" provider, a stand-in for LDAP: a token
# minted for one (kayra token mint --provider local --subject <id>) gets
# its groups from here.
users:
  - id: admin
    attributes: {email: admin@example.com, name: Dev Admin}
    groups: [sandbox-core-sysadmin]
  - id: jdoe
    attributes: {email: jdoe@example.com, name: John Doe}
    groups: [sandbox-thetenant-admins]
  - id: nobody
    attributes: {email: nobody@example.com, name: No Body}
    groups: []

# The example API, examples/compute (make example, make api-add).
example:
  api: compute       # <name>.<domain>, one of apis above
  port: 8080         # on the host, where the gateway reaches it
