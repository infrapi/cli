version: 2

project_name: infrapi-cli

builds:
  - id: infrapi-cli
    main: ./cmd/infrapi-cli
    binary: infrapi-cli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: infrapi-cli
    ids: [infrapi-cli]
    name_template: >-
      infrapi-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# The container image, multi-platform, on every release: the binary above
# in the Dockerfile at the repository root. Tags: the version (0.5.0), its
# minor (0.5) and latest, the last two only for a release that is not a
# pre-release. The CI logs in to ghcr.io first.
dockers_v2:
  - id: infrapi-cli
    ids: [infrapi-cli]
    dockerfile: Dockerfile
    images:
      - ghcr.io/infrapi/cli
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: infrapi-cli
      org.opencontainers.image.description: infrapi-cli, the InfraPI client, for CI jobs and scripts
      org.opencontainers.image.source: https://github.com/infrapi/cli
      org.opencontainers.image.url: https://github.com/infrapi/cli
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT

# go-semantic-release (see .github/workflows/ci.yml) tags and creates the
# GitHub release with its own notes before this runs: append the built
# artifacts to that release rather than writing a second changelog.
release:
  mode: append

changelog:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"
